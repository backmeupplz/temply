name: CI
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    # Our own PRs and pushes run on the Mac runners; outsiders' PRs (AGit via the github bot) on Linux
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude","radiant"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # Actions pinned to a commit: the runners cache those, a tag is fetched from GitHub every job (~20 s)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Production's Node major (.nvmrc); the Mac runners keep their tool cache, so this is a cache hit there
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Linux caches node_modules (a hit skips the install). On the Mac yarn keeps its cache per runner
      # instance: yarn 1 corrupts a cache shared by concurrent installs
      - id: modules
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc') }}
      # On the Mac, node_modules stays in one fixed copy of the checkout per runner instance: writing it afresh took
      # ~17 s of the job under load, an unchanged lockfile makes the install a no-op
      - name: Persistent source dir (Mac)
        if: runner.os == 'macOS'
        run: |
          src="$RUNNER_TOOL_CACHE/temply-src"
          mkdir -p "$src"
          rsync -rlpc --delete --exclude /.git --exclude /node_modules ./ "$src/"
          echo "SRC=$src" >> "$GITHUB_ENV"
      - if: steps.modules.outputs.cache-hit != 'true'
        run: cd "${SRC:-.}" && yarn install --frozen-lockfile --non-interactive --cache-folder "$RUNNER_TOOL_CACHE/yarn"
      - run: cd "${SRC:-.}" && yarn -s tsc --skipLibCheck && node --test dist/helpers/promo.test.js
